<!-- Paste this entire file into CodePen's HTML panel. Leave CSS and JS panels empty. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>

<style>
  #fo-codepen, #fo-codepen * { box-sizing: border-box; }
  #fo-codepen { position: relative; width: 100%; height: 100vh; min-height: 650px; overflow: hidden; background: #03070c; color: #eaf7ff; font-family: Inter, Arial, sans-serif; }
  #fo-map { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #15273a, #03070c 72%); }
  #fo-codepen .fo-scan { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: .055; background: repeating-linear-gradient(0deg, transparent 0 3px, #fff 4px); }
  #fo-codepen .fo-top { position: absolute; z-index: 5; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
  #fo-codepen .fo-panel { background: rgba(4,12,21,.87); border: 1px solid rgba(89,220,255,.25); border-radius: 10px; box-shadow: 0 14px 38px rgba(0,0,0,.35); backdrop-filter: blur(12px); }
  #fo-codepen .fo-titlebox { min-width: 230px; padding: 11px 14px; }
  #fo-codepen .fo-title { font-size: 13px; font-weight: 900; letter-spacing: .14em; }
  #fo-codepen .fo-summary { margin-top: 6px; color: #9babb9; font-size: 11px; letter-spacing: .06em; }
  #fo-codepen .fo-live { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #76ffad; box-shadow: 0 0 12px #76ffad; }
  #fo-codepen .fo-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; padding: 6px; pointer-events: auto; }
  #fo-codepen button { border: 1px solid rgba(255,255,255,.14); border-radius: 7px; padding: 8px 10px; background: rgba(255,255,255,.06); color: #dcecff; cursor: pointer; font: 800 10px/1 Inter,Arial,sans-serif; letter-spacing: .08em; }
  #fo-codepen button:hover { border-color: rgba(89,220,255,.6); background: rgba(89,220,255,.13); }
  #fo-codepen button.active { color: #031018; background: #59dcff; border-color: #59dcff; }
  #fo-codepen .fo-detail { position: absolute; z-index: 6; left: 14px; bottom: 14px; width: min(390px, calc(100% - 28px)); padding: 13px; transform: translateY(calc(100% + 30px)); opacity: 0; transition: .25s ease; }
  #fo-codepen .fo-detail.open { transform: translateY(0); opacity: 1; }
  #fo-codepen .fo-callsign { font-size: 19px; font-weight: 900; letter-spacing: .08em; }
  #fo-codepen .fo-route { margin-top: 5px; color: #59dcff; font-size: 13px; font-weight: 800; }
  #fo-codepen .fo-metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; margin-top: 12px; background: rgba(89,220,255,.14); }
  #fo-codepen .fo-metric { padding: 9px; background: rgba(4,12,21,.96); }
  #fo-codepen .fo-metric small { display: block; color: #8fa1b1; font-size: 9px; letter-spacing: .08em; }
  #fo-codepen .fo-metric strong { display: block; margin-top: 4px; font-size: 12px; }
  #fo-codepen .fo-proof { position: absolute; z-index: 5; right: 14px; bottom: 14px; padding: 8px 10px; color: #9babb9; font-size: 10px; letter-spacing: .08em; pointer-events: none; }
  #fo-codepen .fo-loader { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(circle, rgba(16,40,62,.8), rgba(2,6,11,.98)); transition: opacity .3s; }
  #fo-codepen .fo-loader.ready { opacity: 0; pointer-events: none; }
  #fo-codepen .fo-loader-inner { padding: 18px; text-align: center; font-size: 11px; font-weight: 900; letter-spacing: .15em; }
  #fo-codepen .fo-sweep { width: 64px; height: 64px; margin: 0 auto 16px; border: 1px solid rgba(89,220,255,.3); border-radius: 50%; background: conic-gradient(transparent 0 78%, #59dcff); animation: fo-spin 1.1s linear infinite; }
  #fo-codepen .fo-loader.failed .fo-sweep { animation: none; background: none; border-color: #ff4d5e; }
  @keyframes fo-spin { to { transform: rotate(360deg); } }
  #fo-codepen .maplibregl-ctrl-bottom-right { opacity: .62; }
  @media (max-width:650px) {
    #fo-codepen { min-height: 560px; }
    #fo-codepen .fo-top { top: 8px; left: 8px; right: 8px; display: block; }
    #fo-codepen .fo-titlebox { display: inline-block; min-width: 0; }
    #fo-codepen .fo-controls { margin-top: 6px; justify-content: flex-start; }
    #fo-codepen .fo-proof { display: none; }
    #fo-codepen .fo-detail { left: 8px; bottom: 8px; width: calc(100% - 16px); }
    #fo-codepen .fo-metrics { grid-template-columns: repeat(2,1fr); }
  }
</style>

<main id="fo-codepen">
  <div id="fo-map"></div>
  <div class="fo-scan"></div>
  <header class="fo-top">
    <section class="fo-panel fo-titlebox">
      <div class="fo-title">FLIGHT ORBIT // SYDNEY</div>
      <div class="fo-summary"><span class="fo-live"></span><span id="fo-summary">INITIALISING</span></div>
    </section>
    <nav class="fo-panel fo-controls" aria-label="Map controls">
      <button id="fo-overview" type="button">OVERVIEW</button>
      <button id="fo-orbit" type="button" class="active">ORBIT</button>
      <button id="fo-trails" type="button" class="active">TRAILS</button>
      <button id="fo-style" type="button">SAT</button>
      <button id="fo-pause" type="button">PAUSE</button>
    </nav>
  </header>
  <section id="fo-detail" class="fo-panel fo-detail" aria-live="polite"></section>
  <aside class="fo-panel fo-proof">SIMULATED AIRCRAFT // ONE-PANEL PROOF</aside>
  <div id="fo-loader" class="fo-loader"><div class="fo-loader-inner"><div class="fo-sweep"></div><span id="fo-loader-text">LOADING BASE MAP</span></div></div>
</main>

<script>
(function () {
  "use strict";

  var loader = document.getElementById("fo-loader");
  var loaderText = document.getElementById("fo-loader-text");
  var startupFinished = false;
  var startupTimer = setTimeout(function () {
    if (startupFinished) return;
    loader.classList.add("failed");
    loaderText.textContent = "STARTUP FAILED — OPEN CODEPEN CONSOLE";
  }, 10000);

  try {
    if (!window.maplibregl || !window.maplibregl.Map) throw new Error("MapLibre script did not load from unpkg.com");

    var flights = [
      { id:"7C6D23", callsign:"QFA412", route:"MEL → SYD", lat:-34.13, lon:150.63, altitude:16800, speed:382, heading:36, model:"Boeing 737-800" },
      { id:"7C4A11", callsign:"VOZ817", route:"BNE → SYD", lat:-33.62, lon:151.04, altitude:11200, speed:338, heading:214, model:"Boeing 737-800" },
      { id:"7C81F2", callsign:"JST721", route:"HBA → SYD", lat:-34.32, lon:151.12, altitude:22400, speed:421, heading:318, model:"Airbus A320" },
      { id:"7C19B0", callsign:"RXA154", route:"DBO → SYD", lat:-33.45, lon:150.47, altitude:9400, speed:276, heading:118, model:"Saab 340B" },
      { id:"A13F77", callsign:"UAL839", route:"LAX → SYD", lat:-33.34, lon:151.34, altitude:28600, speed:468, heading:229, model:"Boeing 787-9" },
      { id:"7C55E8", callsign:"QFA63", route:"SYD → JNB", lat:-34.02, lon:151.27, altitude:7800, speed:308, heading:162, model:"Boeing 787-9" }
    ].map(function (flight) {
      flight.trail = [[flight.lon, flight.lat]];
      return flight;
    });

    var paused = false;
    var orbiting = true;
    var trailsVisible = true;
    var satellite = true;
    var selectedId = null;
    var previousFrame = performance.now();
    var previousOrbitFrame = 0;

    var map = new maplibregl.Map({
      container: "fo-map",
      style: {
        version: 8,
        sources: {
          base: {
            type: "raster",
            tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
            tileSize: 256,
            maxzoom: 19,
            attribution: "Tiles © Esri"
          }
        },
        layers: [{ id:"base", type:"raster", source:"base", paint:{ "raster-saturation":-.2, "raster-contrast":.16, "raster-brightness-max":.78 } }]
      },
      center: [150.91, -33.93],
      zoom: 8.2,
      pitch: 62,
      bearing: -22,
      maxPitch: 85,
      antialias: true,
      fadeDuration: 0
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }), "bottom-right");

    function planeCanvas(colour) {
      var canvas = document.createElement("canvas");
      canvas.width = 96;
      canvas.height = 96;
      var context = canvas.getContext("2d");
      context.translate(48,48);
      context.fillStyle = colour;
      context.strokeStyle = "rgba(2,9,15,.95)";
      context.lineWidth = 2.5;
      context.shadowColor = colour;
      context.shadowBlur = 12;
      var plane = new Path2D("M 0 -41 C 4 -35 5 -24 6 -12 L 34 7 L 34 14 L 6 6 L 5 27 L 16 35 L 16 41 L 0 35 L -16 41 L -16 35 L -5 27 L -6 6 L -34 14 L -34 7 L -6 -12 C -5 -24 -4 -35 0 -41 Z");
      context.fill(plane);
      context.stroke(plane);
      return canvas;
    }

    function pointData() {
      return {
        type:"FeatureCollection",
        features:flights.map(function (flight) {
          return {
            type:"Feature",
            geometry:{ type:"Point", coordinates:[flight.lon,flight.lat] },
            properties:{ id:flight.id, heading:flight.heading, selected:flight.id===selectedId?1:0 }
          };
        })
      };
    }

    function trailData() {
      return {
        type:"FeatureCollection",
        features:flights.filter(function (flight) { return flight.trail.length>1; }).map(function (flight) {
          return {
            type:"Feature",
            properties:{ selected:flight.id===selectedId?1:0 },
            geometry:{ type:"LineString", coordinates:flight.trail }
          };
        })
      };
    }

    function updateSources() {
      var points = map.getSource("flight-points");
      var trails = map.getSource("flight-trails");
      if (points) points.setData(pointData());
      if (trails) trails.setData(trailData());
    }

    function selectFlight(id) {
      selectedId = id;
      var flight = flights.find(function (item) { return item.id===id; });
      if (!flight) return;
      updateSources();
      var detail = document.getElementById("fo-detail");
      detail.innerHTML = '<div class="fo-callsign">'+flight.callsign+'</div>'+
        '<div class="fo-route">'+flight.route+' // '+flight.model+'</div>'+
        '<div class="fo-metrics">'+
        '<div class="fo-metric"><small>ALTITUDE</small><strong>'+flight.altitude.toLocaleString()+' FT</strong></div>'+
        '<div class="fo-metric"><small>SPEED</small><strong>'+flight.speed+' KT</strong></div>'+
        '<div class="fo-metric"><small>HEADING</small><strong>'+Math.round(flight.heading)+'°</strong></div>'+
        '<div class="fo-metric"><small>ICAO</small><strong>'+flight.id+'</strong></div></div>';
      detail.classList.add("open");
      map.easeTo({ center:[flight.lon,flight.lat], zoom:11.2, pitch:74, bearing:flight.heading-35, duration:1500 });
    }

    function overview() {
      selectedId = null;
      document.getElementById("fo-detail").classList.remove("open");
      updateSources();
      var bounds = new maplibregl.LngLatBounds();
      flights.forEach(function (flight) { bounds.extend([flight.lon,flight.lat]); });
      map.fitBounds(bounds,{ padding:80, pitch:62, bearing:-22, maxZoom:10, duration:1300 });
    }

    function addTerrain() {
      try {
        map.addSource("terrain",{ type:"raster-dem", url:"https://tiles.mapterhorn.com/tilejson.json", tileSize:512 });
        map.addLayer({ id:"hillshade", type:"hillshade", source:"terrain", paint:{ "hillshade-exaggeration":.35, "hillshade-shadow-color":"#03101a" } },"tracks");
        map.setTerrain({ source:"terrain", exaggeration:1.15 });
      } catch (error) {
        console.warn("Terrain unavailable; base map remains operational.",error);
      }
    }

    function moveFlights(now) {
      var elapsedHours = Math.min((now-previousFrame)/3600000,.002);
      previousFrame = now;
      if (!paused) {
        flights.forEach(function (flight) {
          var kilometres = flight.speed*1.852*elapsedHours;
          var radians = flight.heading*Math.PI/180;
          flight.lat += Math.cos(radians)*kilometres/111.32;
          flight.lon += Math.sin(radians)*kilometres/(111.32*Math.cos(flight.lat*Math.PI/180));
          if (flight.lat>-33.2 || flight.lat<-34.55 || flight.lon>151.55 || flight.lon<150.25) flight.heading=(flight.heading+180)%360;
          var last = flight.trail[flight.trail.length-1];
          if (Math.hypot(flight.lon-last[0],flight.lat-last[1])>.002) {
            flight.trail.push([flight.lon,flight.lat]);
            if (flight.trail.length>80) flight.trail.shift();
          }
        });
        updateSources();
      }
      if (orbiting && !selectedId && now-previousOrbitFrame>50) {
        previousOrbitFrame=now;
        map.rotateTo((map.getBearing()+.13)%360,{ duration:0 });
      }
      requestAnimationFrame(moveFlights);
    }

    map.once("style.load",function () {
      map.addImage("plane",planeCanvas("#59dcff"),{ pixelRatio:2 });
      map.addImage("plane-selected",planeCanvas("#ffffff"),{ pixelRatio:2 });
      map.addSource("flight-points",{ type:"geojson", data:pointData() });
      map.addSource("flight-trails",{ type:"geojson", data:trailData() });
      map.addLayer({ id:"tracks", type:"line", source:"flight-trails", layout:{ "line-cap":"round", "line-join":"round" }, paint:{ "line-color":["case",["==",["get","selected"],1],"#ffffff","#59dcff"], "line-width":["case",["==",["get","selected"],1],2.8,1.3], "line-opacity":.7 } });
      map.addLayer({ id:"aircraft", type:"symbol", source:"flight-points", layout:{ "symbol-placement":"point", "icon-image":["case",["==",["get","selected"],1],"plane-selected","plane"], "icon-size":["interpolate",["linear"],["zoom"],6,.18,10,.32,14,.48], "icon-rotate":["get","heading"], "icon-rotation-alignment":"map", "icon-pitch-alignment":"map", "icon-allow-overlap":true, "icon-ignore-placement":true } });
      map.on("mouseenter","aircraft",function () { map.getCanvas().style.cursor="pointer"; });
      map.on("mouseleave","aircraft",function () { map.getCanvas().style.cursor=""; });
      map.on("click","aircraft",function (event) { selectFlight(String(event.features[0].properties.id)); });
      overview();
      addTerrain();
      document.getElementById("fo-summary").textContent=flights.length+" AIRCRAFT // SIMULATED LIVE";
      startupFinished=true;
      clearTimeout(startupTimer);
      loader.classList.add("ready");
      setTimeout(function () { loader.style.display="none"; },350);
      requestAnimationFrame(moveFlights);
    });

    map.on("error",function (event) { console.warn("Map resource warning:",event.error&&event.error.message||event); });
    document.getElementById("fo-overview").onclick=overview;
    document.getElementById("fo-orbit").onclick=function () { orbiting=!orbiting; this.classList.toggle("active",orbiting); };
    document.getElementById("fo-trails").onclick=function () { trailsVisible=!trailsVisible; this.classList.toggle("active",trailsVisible); map.setLayoutProperty("tracks","visibility",trailsVisible?"visible":"none"); };
    document.getElementById("fo-pause").onclick=function () { paused=!paused; this.classList.toggle("active",paused); this.textContent=paused?"RESUME":"PAUSE"; };
    document.getElementById("fo-style").onclick=function () {
      satellite=!satellite;
      this.textContent=satellite?"SAT":"DARK";
      map.getSource("base").setTiles(satellite
        ? ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]
        : ["https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png","https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png"]);
    };
  } catch (error) {
    clearTimeout(startupTimer);
    loader.classList.add("failed");
    loaderText.textContent="FAILED: "+error.message;
    console.error(error);
  }
})();
</script>
