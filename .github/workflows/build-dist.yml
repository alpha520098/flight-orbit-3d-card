name: Build dist

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/build-dist.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build HACS bundle
        run: npm run build

      - name: Commit dist if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/flight-orbit-3d-card.js
          if git diff --cached --quiet; then
            echo "dist is already current"
            exit 0
          fi
          git commit -m "chore: rebuild dist bundle for HACS"
          git push
