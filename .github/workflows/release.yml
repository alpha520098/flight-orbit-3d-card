name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check dist/flight-orbit-3d-card.js

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/flight-orbit-3d-card.js
          --verify-tag
          --generate-notes
          --title "Flight Orbit 3D Card ${GITHUB_REF_NAME}"
