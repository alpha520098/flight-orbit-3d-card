name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build HACS bundle
        run: npm run build

      - name: Check JavaScript syntax
        run: node --check dist/flight-orbit-3d-card.js

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/flight-orbit-3d-card.js
          --verify-tag
          --generate-notes
          --title "Flight Orbit 3D Card ${GITHUB_REF_NAME}"
