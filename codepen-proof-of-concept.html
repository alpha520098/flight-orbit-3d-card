<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flight Orbit 3D — CodePen Proof</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
  <style>
    html, body, #flight-demo { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #03070c; }
    #flight-demo { position: relative; color: #eaf7ff; font-family: Inter, system-ui, sans-serif; }
    #map { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #15273a, #03070c 72%); }
    .scan { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: .055; background: repeating-linear-gradient(0deg, transparent 0 3px, #fff 4px); }
    .top { position: absolute; z-index: 5; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
    .panel { background: rgba(4, 12, 21, .86); border: 1px solid rgba(89, 220, 255, .25); border-radius: 10px; box-shadow: 0 14px 38px rgba(0,0,0,.35); backdrop-filter: blur(12px); }
    .title-box { padding: 11px 14px; min-width: 230px; }
    .title { font-size: 13px; font-weight: 900; letter-spacing: .14em; }
    .summary { margin-top: 6px; color: #9babb9; font-size: 11px; letter-spacing: .06em; }
    .live { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #76ffad; box-shadow: 0 0 12px #76ffad; }
    .controls { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; padding: 6px; }
    button { border: 1px solid rgba(255,255,255,.14); border-radius: 7px; padding: 8px 10px; background: rgba(255,255,255,.06); color: #dcecff; cursor: pointer; font: 800 10px/1 Inter, system-ui, sans-serif; letter-spacing: .08em; }
    button:hover { border-color: rgba(89,220,255,.6); background: rgba(89,220,255,.13); }
    button.active { color: #031018; background: #59dcff; border-color: #59dcff; }
    .detail { position: absolute; z-index: 6; left: 14px; bottom: 14px; width: min(390px, calc(100% - 28px)); padding: 13px; transform: translateY(calc(100% + 30px)); opacity: 0; transition: .25s ease; }
    .detail.open { transform: translateY(0); opacity: 1; }
    .callsign { font-size: 19px; font-weight: 950; letter-spacing: .08em; }
    .route { margin-top: 5px; color: #59dcff; font-size: 13px; font-weight: 800; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 12px; background: rgba(89,220,255,.14); }
    .metric { padding: 9px; background: rgba(4,12,21,.96); }
    .metric small { display: block; color: #8fa1b1; font-size: 9px; letter-spacing: .08em; }
    .metric strong { display: block; margin-top: 4px; font-size: 12px; }
    .proof { position: absolute; z-index: 5; right: 14px; bottom: 14px; padding: 8px 10px; color: #9babb9; font-size: 10px; letter-spacing: .08em; pointer-events: none; }
    .loader { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(circle, rgba(16,40,62,.8), rgba(2,6,11,.98)); transition: opacity .3s; }
    .loader.ready { opacity: 0; pointer-events: none; }
    .loader-inner { text-align: center; font-size: 11px; font-weight: 900; letter-spacing: .15em; }
    .sweep { width: 64px; height: 64px; margin: 0 auto 16px; border: 1px solid rgba(89,220,255,.3); border-radius: 50%; background: conic-gradient(transparent 0 78%, #59dcff); animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .maplibregl-ctrl-bottom-right { opacity: .62; }
    @media (max-width: 650px) {
      .top { top: 8px; left: 8px; right: 8px; display: block; }
      .title-box { display: inline-block; min-width: 0; }
      .controls { margin-top: 6px; justify-content: flex-start; }
      .proof { display: none; }
      .detail { left: 8px; bottom: 8px; width: calc(100% - 42px); }
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main id="flight-demo">
    <div id="map"></div>
    <div class="scan"></div>
    <header class="top">
      <section class="panel title-box">
        <div class="title">FLIGHT ORBIT // SYDNEY</div>
        <div class="summary"><span class="live"></span><span id="summary">INITIALISING</span></div>
      </section>
      <nav class="panel controls" aria-label="Map controls">
        <button id="overview" type="button">OVERVIEW</button>
        <button id="orbit" type="button" class="active">ORBIT</button>
        <button id="trails" type="button" class="active">TRAILS</button>
        <button id="style" type="button">SAT</button>
        <button id="pause" type="button">PAUSE</button>
      </nav>
    </header>
    <section id="detail" class="panel detail" aria-live="polite"></section>
    <aside class="panel proof">SIMULATED AIRCRAFT // CODEPEN PROOF</aside>
    <div id="loader" class="loader"><div class="loader-inner"><div class="sweep"></div><span id="loader-text">LOADING 3D AIRSPACE</span></div></div>
  </main>

  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";

    const flights = [
      { id: "7C6D23", callsign: "QFA412", route: "MEL → SYD", lat: -34.13, lon: 150.63, altitude: 16800, speed: 382, heading: 36, model: "Boeing 737-800" },
      { id: "7C4A11", callsign: "VOZ817", route: "BNE → SYD", lat: -33.62, lon: 151.04, altitude: 11200, speed: 338, heading: 214, model: "Boeing 737-800" },
      { id: "7C81F2", callsign: "JST721", route: "HBA → SYD", lat: -34.32, lon: 151.12, altitude: 22400, speed: 421, heading: 318, model: "Airbus A320" },
      { id: "7C19B0", callsign: "RXA154", route: "DBO → SYD", lat: -33.45, lon: 150.47, altitude: 9400, speed: 276, heading: 118, model: "Saab 340B" },
      { id: "A13F77", callsign: "UAL839", route: "LAX → SYD", lat: -33.34, lon: 151.34, altitude: 28600, speed: 468, heading: 229, model: "Boeing 787-9" },
      { id: "7C55E8", callsign: "QFA63", route: "SYD → JNB", lat: -34.02, lon: 151.27, altitude: 7800, speed: 308, heading: 162, model: "Boeing 787-9" },
      { id: "7C2B19", callsign: "JST508", route: "MEL → SYD", lat: -34.21, lon: 150.91, altitude: 13200, speed: 354, heading: 21, model: "Airbus A321neo" },
      { id: "7C73A4", callsign: "VOZ965", route: "BNE → SYD", lat: -33.74, lon: 151.25, altitude: 6400, speed: 294, heading: 238, model: "Boeing 737 MAX 8" }
    ].map(flight => ({ ...flight, trail: [[flight.lon, flight.lat]] }));

    let paused = false;
    let orbiting = true;
    let trailsVisible = true;
    let satellite = true;
    let selectedId = null;
    let previousFrame = performance.now();
    let previousOrbitFrame = 0;

    const baseStyle = mode => ({
      version: 8,
      sources: {
        base: {
          type: "raster",
          tiles: mode === "satellite"
            ? ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]
            : ["https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png", "https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png"],
          tileSize: mode === "satellite" ? 256 : 512,
          maxzoom: 19,
          attribution: mode === "satellite" ? "Tiles © Esri" : "© OpenStreetMap © CARTO"
        }
      },
      layers: [{ id: "base", type: "raster", source: "base", paint: { "raster-saturation": mode === "satellite" ? -0.2 : -0.7, "raster-contrast": 0.16, "raster-brightness-max": 0.78 } }],
      sky: {}
    });

    const map = new maplibregl.Map({
      container: "map",
      style: baseStyle("satellite"),
      center: [150.91, -33.93],
      zoom: 8.2,
      pitch: 62,
      bearing: -22,
      maxPitch: 85,
      antialias: true,
      fadeDuration: 0
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");

    const planeCanvas = colour => {
      const canvas = document.createElement("canvas");
      canvas.width = 96;
      canvas.height = 96;
      const context = canvas.getContext("2d");
      context.translate(48, 48);
      context.fillStyle = colour;
      context.strokeStyle = "rgba(2,9,15,.95)";
      context.lineWidth = 2.5;
      context.shadowColor = colour;
      context.shadowBlur = 12;
      const plane = new Path2D("M 0 -41 C 4 -35 5 -24 6 -12 L 34 7 L 34 14 L 6 6 L 5 27 L 16 35 L 16 41 L 0 35 L -16 41 L -16 35 L -5 27 L -6 6 L -34 14 L -34 7 L -6 -12 C -5 -24 -4 -35 0 -41 Z");
      context.fill(plane);
      context.stroke(plane);
      return canvas;
    };

    const pointData = () => ({
      type: "FeatureCollection",
      features: flights.map(flight => ({
        type: "Feature",
        geometry: { type: "Point", coordinates: [flight.lon, flight.lat] },
        properties: {
          id: flight.id,
          heading: flight.heading,
          heightMeters: Math.round(flight.altitude * 0.3048),
          selected: flight.id === selectedId ? 1 : 0
        }
      }))
    });

    const trailData = () => ({
      type: "FeatureCollection",
      features: flights.filter(flight => flight.trail.length > 1).map(flight => ({
        type: "Feature",
        properties: { selected: flight.id === selectedId ? 1 : 0 },
        geometry: { type: "LineString", coordinates: flight.trail }
      }))
    });

    const installLayers = () => {
      map.addImage("plane", planeCanvas("#59dcff"), { pixelRatio: 2 });
      map.addImage("plane-selected", planeCanvas("#ffffff"), { pixelRatio: 2 });
      map.addSource("flight-points", { type: "geojson", data: pointData() });
      map.addSource("flight-trails", { type: "geojson", data: trailData() });
      map.addLayer({
        id: "trails",
        type: "line",
        source: "flight-trails",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": ["case", ["==", ["get", "selected"], 1], "#ffffff", "#59dcff"], "line-width": ["case", ["==", ["get", "selected"], 1], 2.8, 1.3], "line-opacity": 0.7 }
      });
      const common = {
        "symbol-placement": "point",
        "symbol-height-offset": ["get", "heightMeters"],
        "icon-rotation-alignment": "map",
        "icon-pitch-alignment": "map",
        "icon-allow-overlap": true,
        "icon-ignore-placement": true
      };
      map.addLayer({
        id: "aircraft",
        type: "symbol",
        source: "flight-points",
        layout: {
          ...common,
          "icon-image": ["case", ["==", ["get", "selected"], 1], "plane-selected", "plane"],
          "icon-size": ["interpolate", ["linear"], ["zoom"], 6, .18, 10, .32, 14, .48],
          "icon-rotate": ["get", "heading"]
        }
      });
      map.on("mouseenter", "aircraft", () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "aircraft", () => { map.getCanvas().style.cursor = ""; });
      map.on("click", "aircraft", event => selectFlight(String(event.features?.[0]?.properties?.id || "")));
    };

    const addTerrain = () => {
      try {
        map.addSource("terrain", { type: "raster-dem", url: "https://tiles.mapterhorn.com/tilejson.json", tileSize: 512 });
        map.addLayer({ id: "hillshade", type: "hillshade", source: "terrain", paint: { "hillshade-exaggeration": .35, "hillshade-shadow-color": "#03101a" } }, "trails");
        map.setTerrain({ source: "terrain", exaggeration: 1.15 });
      } catch (error) {
        console.warn("Terrain unavailable; continuing with pitched map.", error);
      }
    };

    const selectFlight = id => {
      selectedId = id;
      const flight = flights.find(item => item.id === id);
      if (!flight) return;
      updateSources();
      const detail = document.getElementById("detail");
      detail.innerHTML = `
        <div class="callsign">${flight.callsign}</div>
        <div class="route">${flight.route} // ${flight.model}</div>
        <div class="metrics">
          <div class="metric"><small>ALTITUDE</small><strong>${flight.altitude.toLocaleString()} FT</strong></div>
          <div class="metric"><small>SPEED</small><strong>${flight.speed} KT</strong></div>
          <div class="metric"><small>HEADING</small><strong>${Math.round(flight.heading)}°</strong></div>
          <div class="metric"><small>ICAO</small><strong>${flight.id}</strong></div>
        </div>`;
      detail.classList.add("open");
      map.easeTo({ center: [flight.lon, flight.lat], zoom: 11.2, pitch: 74, bearing: flight.heading - 35, duration: 1700 });
    };

    const updateSources = () => {
      map.getSource("flight-points")?.setData(pointData());
      map.getSource("flight-trails")?.setData(trailData());
    };

    const overview = () => {
      selectedId = null;
      document.getElementById("detail").classList.remove("open");
      updateSources();
      const bounds = new maplibregl.LngLatBounds();
      flights.forEach(flight => bounds.extend([flight.lon, flight.lat]));
      map.fitBounds(bounds, { padding: 80, pitch: 62, bearing: -22, maxZoom: 10, duration: 1500 });
    };

    const moveFlights = now => {
      const elapsedHours = Math.min((now - previousFrame) / 3600000, .002);
      previousFrame = now;
      if (!paused) {
        for (const flight of flights) {
          const kilometres = flight.speed * 1.852 * elapsedHours;
          const radians = flight.heading * Math.PI / 180;
          flight.lat += Math.cos(radians) * kilometres / 111.32;
          flight.lon += Math.sin(radians) * kilometres / (111.32 * Math.cos(flight.lat * Math.PI / 180));
          if (flight.lat > -33.2 || flight.lat < -34.55 || flight.lon > 151.55 || flight.lon < 150.25) flight.heading = (flight.heading + 175 + Math.random() * 10) % 360;
          if (!flight.trail.length || Math.hypot(flight.lon - flight.trail.at(-1)[0], flight.lat - flight.trail.at(-1)[1]) > .002) {
            flight.trail.push([flight.lon, flight.lat]);
            if (flight.trail.length > 90) flight.trail.shift();
          }
        }
        updateSources();
        document.getElementById("summary").textContent = `${flights.length} AIRCRAFT // SIMULATED LIVE`;
      }
      if (orbiting && now - previousOrbitFrame > 45 && !selectedId) {
        previousOrbitFrame = now;
        map.rotateTo((map.getBearing() + .12) % 360, { duration: 0 });
      }
      requestAnimationFrame(moveFlights);
    };

    map.once("style.load", () => {
      installLayers();
      addTerrain();
      overview();
      document.getElementById("loader").classList.add("ready");
      setTimeout(() => { document.getElementById("loader").style.display = "none"; }, 350);
      requestAnimationFrame(moveFlights);
    });

    map.on("error", event => console.warn("Map resource warning:", event.error?.message || event));
    document.getElementById("overview").addEventListener("click", overview);
    document.getElementById("orbit").addEventListener("click", event => {
      orbiting = !orbiting;
      event.currentTarget.classList.toggle("active", orbiting);
    });
    document.getElementById("trails").addEventListener("click", event => {
      trailsVisible = !trailsVisible;
      event.currentTarget.classList.toggle("active", trailsVisible);
      map.setLayoutProperty("trails", "visibility", trailsVisible ? "visible" : "none");
    });
    document.getElementById("pause").addEventListener("click", event => {
      paused = !paused;
      event.currentTarget.classList.toggle("active", paused);
      event.currentTarget.textContent = paused ? "RESUME" : "PAUSE";
    });
    document.getElementById("style").addEventListener("click", event => {
      satellite = !satellite;
      event.currentTarget.textContent = satellite ? "SAT" : "DARK";
      const tiles = satellite
        ? ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]
        : ["https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png", "https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png"];
      map.getSource("base").setTiles(tiles);
    });
  </script>
</body>
</html>
